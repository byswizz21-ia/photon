# Installateur Windows de Photon : `npm run dist` produit dist/Photon-Setup-<version>.exe
appId: fr.hugo.photon
productName: Photon
artifactName: Photon-Setup-${version}.exe

directories:
  output: dist
  buildResources: assets

# app.asar minimal : aucune dépendance runtime ; renderer, police et icônes sont déjà dans out/
# (en prod, `?asset` copie les .ico dans out/main/chunks/, c'est ce chemin que le main lit).
files:
  - out/**
  - package.json

# Tray et icône de fenêtre lisent de vrais fichiers .ico, hors de l'asar.
asarUnpack:
  - out/main/chunks/*.ico

# Verrous gravés dans Photon.exe : personne ne peut s'en servir comme Node (ELECTRON_RUN_AS_NODE,
# NODE_OPTIONS, --inspect) ni lui faire charger un autre code que son app.asar vérifié.
# file:// garde ses droits : l'interface est chargée par loadFile.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  target:
    - target: nsis
      arch: x64
  icon: assets/icon.ico

# Pas de script NSIS : le lancement au démarrage de Windows est géré par l'app elle-même.
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createStartMenuShortcut: true
  createDesktopShortcut: false
  shortcutName: Photon
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
